<div [ngStyle]="
{
    'background': getTheme() === 'dark' ? '#222' : '#f5f5f5',
    'color': getTheme() === 'dark' ? 'white' : 'black',
    'padding': '20px'
}">

<h3>Content Area</h3>

<p *ngIf="getLanguage() === 'en'">This is some content in English.</p>
<p *ngIf="getLanguage() === 'es'">Este es un contenido en Español.</p>

</div>
